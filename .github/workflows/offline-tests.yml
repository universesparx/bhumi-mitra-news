name: Offline prototype tests
on:
  workflow_dispatch:
  push:
    paths:
      - "news_review.py"
      - "source_gate.py"
      - "approved_feed.py"
      - "cloudflare/**"
      - "tests/**"
      - "source_registry.json"
      - ".github/workflows/offline-tests.yml"
  pull_request:
    paths:
      - "news_review.py"
      - "source_gate.py"
      - "approved_feed.py"
      - "cloudflare/**"
      - "tests/**"
      - "source_registry.json"
      - ".github/workflows/offline-tests.yml"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Run Cloudflare authentication boundary tests
        run: cd cloudflare && npm test
      - name: Verify local D1 schema and stale-review behavior
        run: |
          cd cloudflare
          npm install --no-save --no-package-lock --ignore-scripts wrangler@4
          node scripts/local-d1-check.mjs
      - name: Ensure automation stays disabled
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("source_registry.json").read_text(encoding="utf-8"))
          assert data["collection_enabled"] is False
          assert all(x["collection_enabled"] is False for x in data["sources"])
          print("Collection remains disabled")
          PY
